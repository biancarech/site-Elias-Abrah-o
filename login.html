<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Colégio Elias Abrahão</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="container">

        <div class="lado-esquerdo">

            <div class="logo">
                <h1>Colégio<br>Elias Abrahão</h1>
                <p>Cívico-Militar</p>
            </div>

            <div class="mensagem">
                <h2>Bem-vindo!</h2>

                <p>
                    Acesse sua conta para continuar
                    no sistema do colégio.
                </p>
            </div>

        </div>


        <div class="lado-direito">

            <div class="formulario">

                <h2>Entrar</h2>

                <p class="subtitulo">
                    Entre com seus dados de acesso
                </p>


                <form>

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >


                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >


                    <div class="opcoes">

                        <label class="lembrar">
                            <input type="checkbox">
                            Lembrar de mim
                        </label>

                        <a href="#">
                            Esqueci minha senha
                        </a>

                    </div>


                    <button type="submit">
                        Entrar
                    </button>

                </form>


                <p class="cadastro">
                    Ainda não possui uma conta?
                    <a href="cadastro.html">Cadastre-se</a>
                </p>


                <a href="index.html" class="voltar">
                    ← Voltar para o site
                </a>

            </div>

        </div>

    </div>

</body>

</html>
